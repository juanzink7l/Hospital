{% extends 'base-login.html' %}

{% block title %}
    Cadastrar Novo Usuário
{% endblock %}

{% load static %}

{% block content %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #111827;
        color: white;
        font-family: Arial, sans-serif;
    }

    /* Área principal */
    .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* Título */
    h1 {
        color: white;
        font-size: 28px;
        text-align: center;
        margin-bottom: 10px !important;
    }

    /* Linha */
    hr {
        width: 100%;
        max-width: 450px;
        border: 0;
        border-top: 1px solid #374151;
        margin-bottom: 20px;
    }

    /* Mensagem de erro */
    .error {
        width: 100%;
        max-width: 450px;
        padding: 12px;
        margin-bottom: 15px;
        text-align: center;
        color: #fca5a5;
        background-color: #3f1d1d;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        font-size: 14px;
    }

    /* Card do formulário */
    form {
        width: 100%;
        max-width: 450px;
        padding: 30px;
        background-color: #1f2937;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .form-group {
        margin-bottom: 18px;
        width: 100%;
    }

    /* Labels */
    .form-label,
    form label {
        display: block;
        color: #e5e7eb;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 14px;
    }

    /* Inputs */
    .form-control {
        display: block;
        width: 100%;
        height: 45px;
        background-color: #111827;
        color: white;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 10px 13px;
        outline: none;
        transition: all 0.2s ease-in-out;
        font-size: 15px;
    }

    /* Input selecionado */
    .form-control:focus {
        background-color: #111827;
        color: white;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* Botão */
    .btn-primary {
        display: block;
        width: 100%;
        height: 45px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        margin-top: 10px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
    }

    /* Hover do botão */
    .btn-primary:hover {
        background-color: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
    }

    /* Texto inferior */
    form p {
        color: #9ca3af;
        text-align: center;
        font-size: 14px;
        margin-top: 20px;
    }

    /* Link */
    form a {
        color: #60a5fa;
        font-weight: bold;
        text-decoration: none;
    }

    form a:hover {
        color: #93c5fd;
        text-decoration: underline;
    }

    /* Celular */
    @media (max-width: 576px) {
        h1 {
            font-size: 24px;
        }

        form {
            padding: 25px 20px;
        }
    }
</style>

<div class="container">
    <h1>Cadastrar Novo Usuário</h1>
    <hr>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form action="" method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="username" class="form-label">Nome de Usuário:</label>
            <input type="text" id="username" class="form-control" name="username" required>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Senha:</label>
            <input type="password" id="password" class="form-control" name="password" required>
        </div>

        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirme a senha:</label>
            <input type="password" id="confirm_password" class="form-control" name="confirm_password" required>
        </div> 

        <button type="submit" class="btn btn-primary">Cadastrar</button>

        <p>Já possui cadastro? <a href="/login">Faça o login</a></p>
    </form>
</div>
{% endblock %}
