{% extends 'base-login.html' %}

{% block title %}Login | SUS{% endblock %}

{% load static %}

{% block content %}

<div class="container d-flex vh-100 align-items-center justify-content-center">

    <div class="row">

        <figure class="d-flex justify-content-center mb-3">
            <img
                src="{% static 'img/logo.png' %}"
                alt="Logo"
                width="200"
                class="img-logo img-fluid"
            />
        </figure>

        <h1 class="nome-hospital d-flex justify-content-center mb-5">
            Santa Casa<br>
            do Desespero
        </h1>

        <div class="d-flex justify-content-center col-12">

            <form action="" method="POST">

                {% csrf_token %}

                <div class="col-12">

                    <label for="username" class="form-label">
                        Usuário:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        id="username"
                        required
                    >

                </div>

                <div class="col-12">

                    <label for="password" class="form-label">
                        Senha:
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        id="password"
                        required
                    >

                </div>

                <div class="d-flex justify-content-center mt-5">

                    <button type="submit" class="btn btn-success col-4">
                        Entrar
                    </button>

                </div>

                <p class="mt-3">
                    Não possui cadastro?
                    <a href="novoUsuario/">Cadastre-se</a>.
                </p>

            </form>

        </div>

    </div>

</div>

{% endblock %}
